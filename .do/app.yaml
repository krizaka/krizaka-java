# java.krizaka.com — the documentation of Krizaka Java: a static site (no service, worker, job, database or function).
# It is built from this repository's site/ and redeployed on every push to main (and the artifacts it describes are read
# at build: the POMs of the Krizaka Java repositories and Maven Central). Project: krizaka.
name: krizaka-java-site
region: tor
static_sites:
  - name: site
    github:
      repo: krizaka/krizaka-java
      branch: main
      deploy_on_push: true
    source_dir: site
    build_command: npm ci && npm run build
    output_dir: out
    environment_slug: node-js
    error_document: 404.html
    envs:
      # The commit being built, served at /build.json for the post-deploy workflow (site/scripts/build-info.mjs).
      - key: APP_COMMIT
        value: ${_self.COMMIT_HASH}
        scope: BUILD_TIME
domains:
  - domain: java.krizaka.com
    type: PRIMARY

# Explicit, as in the live app: every path goes to the site.
ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: site
